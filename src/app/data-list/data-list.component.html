<div class="container" style="margin-top: 70px;">
  <table class="table table-hover">
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>DeviceType</th>
        <th>MessageContent</th>
        <th>MediaContent</th>
        <th>timeStamp</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let device of devices| paginate : {
        itemsPerPage: pageSize,
        currentPage: pageNumber,
        totalItems: pageItemsTotalCount
      }; let i = index">
      <td>{{ i+1+ (pageNumber - 1) * pageSize }}</td>
      <td>{{ device.name }}</td>
      <td>{{ device.deviceType }}</td>
      <td>{{ device.messageContent }}</td>
      <td>
        <a href="" target="_blank" (click)="enlarge($event)" title="Click to enlarge image in new tab">
          <img [src]="device.mediaContent" alt="Click to enlarge" style="width: 100px; height: 100px; cursor: pointer;">
        </a>
      </td>
      <td>{{ device.timeStamp }}</td>
      </tr>
    </tbody>
  </table>
</div>
<div class="col-md-12">
  <pagination-controls
    previousLabel="Prev"
    nextLabel="Next"
    [responsive]="true"
    (pageChange)="handlePageChange($event)"
    (pageBoundsCorrection)="handlePageChange($event)"
  ></pagination-controls>
</div>
